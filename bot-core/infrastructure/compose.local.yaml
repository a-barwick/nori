# Explicit local build override; image-only local runs use compose.yaml.
services:
  bot-core:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
  bot-web:
    build:
      context: ${BOT_WEB_CONTEXT:?Set BOT_WEB_CONTEXT to the separate bot-web checkout}
      dockerfile: infrastructure/Dockerfile
  computer:
    build:
      context: ./computer
