# Public site for www.noribot.chat. The bare noribot.chat domain also points here:
# its site pages move to www, and every other path moves to the app at app.noribot.chat.

server {
    listen 8080;
    server_name noribot.chat;

    location = / { return 301 https://www.noribot.chat/; }
    location ~ ^/(about|privacy|terms)/?$ { return 301 https://www.noribot.chat/$1; }
    location = /healthz { access_log off; return 200 "ok\n"; }
    # 308 keeps the method and body for old app links and in-flight OAuth callbacks.
    location / { return 308 https://app.noribot.chat$request_uri; }
}

server {
    listen 8080 default_server;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; script-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    location = /healthz { access_log off; return 200 "ok\n"; }
    location ~ \.html$ { try_files $uri =404; }
    location / { try_files $uri $uri.html $uri/ =404; }
    location ~* \.(css|png|jpg|ico)$ {
        expires 1h;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }
}
