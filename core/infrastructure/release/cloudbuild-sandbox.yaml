# Triggered only by SUCCESS of nori-main-prepare; native provenance is rechecked.
# The operator supplies the previously published immutable tools image at setup.
steps:
  - id: validate-tools
    name: gcr.io/google.com/cloudsdktool/google-cloud-cli:584.0.0-slim
    entrypoint: bash
    env: ['TOOLS_IMAGE=$_TOOLS_IMAGE']
    args:
      - -ceu
      - |
        [[ "$$TOOLS_IMAGE" =~ ^us-central1-docker[.]pkg[.]dev/bot-111549/nori-poc/release-tools@sha256:[a-f0-9]{64}$$ ]] || { echo 'Use the reviewed immutable release-tools image digest'; exit 1; }
  - name: '$_TOOLS_IMAGE'
    waitFor: [validate-tools]
    entrypoint: python3
    args: [core/infrastructure/release/release.py, release, --commit, '$_SOURCE_COMMIT', --prepare-build, '$_PREPARE_BUILD_ID']
    env:
      - 'NORI_RELEASE_BUCKET=bot-111549-nori-poc'
      - 'NORI_STATE_BUCKET=bot-111549-nori-ci-state'
      - 'NORI_BUILD_REGION=us-central1'
      - 'NORI_TF_BACKEND=gcs'
      - 'NORI_ENVIRONMENT=sandbox'
      - 'BUILD_ID=$BUILD_ID'
substitutions:
  _SOURCE_COMMIT: ''
  _PREPARE_BUILD_ID: ''
  _PREPARE_STATUS: ''
  _PREPARE_TRIGGER: ''
  _TOOLS_IMAGE: ''
timeout: 1800s
options:
  logging: CLOUD_LOGGING_ONLY
