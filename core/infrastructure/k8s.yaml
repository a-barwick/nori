apiVersion: apps/v1
kind: Deployment
metadata:
  name: nori-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nori-core
  template:
    metadata:
      labels:
        app: nori-core
    spec:
      containers:
        - name: nori-core
          image: nori-core:local
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: nori-core
spec:
  selector:
    app: nori-core
  ports:
    - port: 8080
      targetPort: http
