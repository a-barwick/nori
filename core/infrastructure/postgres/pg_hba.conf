# LOCAL DEVELOPMENT ONLY. Match the control subnet in compose.yaml.
# OrbStack permits cross-bridge IP traffic, so bridge membership is not enough.
local all all trust
# OrbStack NATs cross-bridge traffic through the destination gateway.
host all all 172.28.40.1/32 reject
host nori nori 172.28.40.0/24 trust
host temporal,temporal_visibility temporal 172.28.40.0/24 trust
host all all 0.0.0.0/0 reject
host all all ::/0 reject
