      operationId: listModelKeys
      tags: [Settings]
      summary: List BYOK model provider API key configuration statuses
      responses:
        "200":
          description: Model keys status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelKeysResponse"

  /v1/settings/model-keys/{provider}:
    put:
      operationId: saveModelKey
      tags: [Settings]
      summary: Validate and store a BYOK provider API key
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetModelKeyRequest"
      responses:
        "200":
          description: Updated provider key status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelKeyProvider"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      operationId: deleteModelKey
      tags: [Settings]
      summary: Remove a BYOK provider API key
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated provider key status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelKeyProvider"
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /v1/settings/models:
    get:
      operationId: getModelSettings
      tags: [Settings]
      summary: Read available model profiles, active selection, and recommendations
      responses:
        "200":
          description: Model settings view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelSettings"
    put:
      operationId: saveModelSettings
      tags: [Settings]
      summary: Update active chat/task model selection and home-only preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveModelSettingsRequest"
      responses:
        "200":
          description: Updated model settings view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelSettings"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /v1/settings/home-connectors:
    get:
      operationId: listHomeConnectors
      tags: [Settings]
      summary: List paired Home AI connectors and installer downloads
      responses:
        "200":
          description: Home connectors view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeConnectors"

  /v1/settings/home-connectors/pairing/lookup:
    post:
      operationId: lookupHomePairing
      tags: [Settings]
      summary: Look up a pending Home AI connector pairing code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomePairingRequest"
      responses:
        "200":
          description: Pairing details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomePairing"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"

  /v1/settings/home-connectors/pairing/approve:
    post:
      operationId: approveHomePairing
      tags: [Settings]
      summary: Approve a pending Home AI connector pairing code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomePairingRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContentResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"

  /v1/settings/home-connectors/{id}/test:
    post:
      operationId: testHomeConnector
      tags: [Settings]
      summary: Test connectivity to a paired Home AI connector
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Connector is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeConnectorTestResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"

  /v1/settings/home-connectors/{id}:
    delete:
      operationId: revokeHomeConnector
      tags: [Settings]
      summary: Revoke and disconnect a paired Home AI connector
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          $ref: "#/components/responses/NoContentResponse"

  /v1/settings/api-costs:
    get:
      operationId: getApiCosts
      tags: [Settings]
      summary: Read aggregated API usage costs over 1, 7, or 30 days
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            enum: [1, 7, 30]
            default: 30
      responses:
        "200":
          description: Cost report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostReport"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /v1/settings/reset:
    post:
      operationId: resetUserData
      tags: [Settings]
      summary: Erase all user conversation, memory, and workspace data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataResetRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContentResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "502":
          $ref: "#/components/responses/ErrorResponse"

  /v1/settings/account/delete:
    post:
      operationId: deleteAccount
      tags: [Settings]
      summary: Permanently delete the signed-in user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeleteRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContentResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "502":
          $ref: "#/components/responses/ErrorResponse"

  /v1/diagnostics:
    get:
      operationId: listDiagnostics
      tags: [Diagnostics]
      summary: List active health diagnostics for tasks, schedules, connections, and MCP servers
      responses:
        "200":
          description: Diagnostics list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DiagnosticItem"
                  next_cursor:
                    type: string

  /v1/diagnostics/actions:
    post:
      operationId: performDiagnosticsAction
      tags: [Diagnostics]
      summary: Run a self-healing diagnostics repair action
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosticsActionRequest"
      responses:
        "200":
          description: Repair action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /v1/feedback:
    post:
      operationId: submitFeedback
      tags: [Diagnostics]
      summary: Submit structured feedback referencing a task, operation, or connection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        "201":
          description: Feedback recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ID"
    TaskIdParam:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    CursorParam:
      name: cursor
      in: query
      schema:
        type: string

  responses:
    ErrorResponse:
      description: Error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/APIError"
    NoContentResponse:
      description: Request succeeded with no response body

  schemas:
    # -------------------------------------------------------------------------
    # Common primitives & shared envelopes
    # -------------------------------------------------------------------------
    ID:
      type: string
      minLength: 1
      maxLength: 128

    UUID:
      type: string
      format: uuid

    Revision:
      type: integer
      minimum: 0

    Instant:
      type: string
      format: date-time

    LocalDate:
      type: string
      pattern: "^\\d{4}-\\d{2}-\\d{2}$"

    Timezone:
      type: string
      minLength: 1
      maxLength: 64

    Effect:
      type: string
      enum: [read, reversible_write, sensitive_send, unknown, control]

    Outcome:
      type: string
      enum: [pending, ready, attempted, submitted, confirmed, failed, uncertain, skipped, voided]

    DefinitionRef:
      type: object
      required: [id, version, digest]
      properties:
        id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        digest:
          type: string
          minLength: 1

    ResourceRef:
      type: object
      required: [connection_id, kind, provider_id]
      properties:
        connection_id:
          $ref: "#/components/schemas/ID"
        kind:
          type: string
          minLength: 1
        provider_id:
          type: string
          minLength: 1
        provider_revision:
          type: string
        url:
          type: string

    WorkRef:
      type: object
      required: [task_id]
      properties:
        task_id:
          type: string
          minLength: 1
        operation_id:
          type: string

    ErrorDetail:
      type: object
      required: [code, message, retryable]
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean

    Cost:
      type: object
      required: [status]
      properties:
        amount_usd:
          type: number
          minimum: 0
        status:
          type: string
          enum: [known, unknown, not_applicable]

    AuthAttempt:
      type: object
      required: [id, authorize_url, expires_at]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        authorize_url:
          type: string
          format: uri
        expires_at:
          $ref: "#/components/schemas/Instant"

    MutationReceipt:
      oneOf:
        - type: object
          required: [request_id, accepted, status, resource]
          properties:
            request_id:
              $ref: "#/components/schemas/UUID"
            accepted:
              type: boolean
              enum: [true]
            status:
              type: string
              enum: [applied]
            resource: {}
            auth:
              $ref: "#/components/schemas/AuthAttempt"
        - type: object
          required: [request_id, accepted, status, resource]
          properties:
            request_id:
              $ref: "#/components/schemas/UUID"
            accepted:
              type: boolean
              enum: [true]
            status:
              type: string
              enum: [queued]
            resource: {}
            work:
              $ref: "#/components/schemas/WorkRef"
            auth:
              $ref: "#/components/schemas/AuthAttempt"

    APIError:
      type: object
      required: [error]
      properties:
        error:
          type: string
        code:
          type: string
        retryable:
          type: boolean
        accepted:
          type: boolean
        request_id:
          type: string
        receipt:
          $ref: "#/components/schemas/MutationReceipt"
        current: {}
        feature:
          type: string

    ErrorCode:
      type: string
      enum:
        - revision_conflict
        - idempotency_conflict
        - interaction_stale
        - validation_failed
        - not_found
        - credential_store_unavailable
        - provider_unavailable
        - account_delete_pending
        - account_delete_not_pending
        - account_delete_forbidden
        - account_delete_busy
        - data_reset_pending
        - data_reset_not_pending
        - invalid_api_key
        - missing_api_key
        - model_selection_unavailable
        - payload_too_large

    AssistantSummary:
      type: object
      required: [revision, needs_you, working, apps_attention, inbox_unread]
      properties:
        revision:
          $ref: "#/components/schemas/Revision"
        needs_you:
          type: integer
          minimum: 0
        working:
          type: integer
          minimum: 0
        apps_attention:
          type: integer
          minimum: 0
        inbox_unread:
          type: integer
          minimum: 0
        next_scheduled_at:
          $ref: "#/components/schemas/Instant"

    UploadAccept:
      type: object
      required: [media_types, max_bytes]
      properties:
        media_types:
          type: array
          items:
            type: string
        max_bytes:
          type: integer
          minimum: 1
        extensions:
          type: array
          items:
            type: string

    AssistantFeatures:
      type: object
      properties:
        integrations:
          type: boolean
        connections:
          type: boolean
        mcp:
          type: boolean
        interactions:
          type: boolean
        work:
          type: boolean
        automations:
          type: boolean
        goals:
          type: boolean
        library:
          type: boolean
        search:
          type: boolean
        permissions:
          type: boolean
        preferences:
          type: boolean
        memory:
          type: boolean
        inbox:
          type: boolean
        operations:
          type: boolean

    Capabilities:
      type: object
      required: [contract, service, conversationModes, features]
      properties:
        contract:
          type: string
          enum: [nori-chat-2]
        conversationContract:
          type: string
          enum: [nori-conversations-1]
        service:
          type: string
          enum: [nori]
        persistence:
          type: string
        provider:
          type: string
        model:
          type: string
        conversationModes:
          type: array
          items:
            type: string
            enum: [assistant]
        features:
          type: object
          properties:
            backgroundTasks:
              type: boolean
            jev:
              type: boolean
        assistant_contract:
          type: string
          enum: [nori-assistant-1]
        assistant_features:
          $ref: "#/components/schemas/AssistantFeatures"
        upload_accept:
          $ref: "#/components/schemas/UploadAccept"
        model_profiles:
          $ref: "#/components/schemas/ModelProfileCatalog"

    WorkingHoursSlot:
      type: object
      required: [day, start, end]
      properties:
        day:
          type: integer
          minimum: 0
          maximum: 6
        start:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        end:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"

    WorkingHours:
      type: array
      items:
        $ref: "#/components/schemas/WorkingHoursSlot"

    QuietHours:
      type: object
      required: [start, end]
      properties:
        start:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
        end:
          type: string
          pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"

    BudgetPreferences:
      type: object
      required: [task_usd]
      properties:
        task_usd:
          type: number
          minimum: 0
        monthly_usd:
          type: number
          minimum: 0

    InputPreferences:
      type: object
      properties:
        dictation_language:
          type: string

    Preferences:
      type: object
      required:
        - revision
        - timezone
        - working_hours
        - default_destination_ids
        - account_defaults
        - budgets
      properties:
        revision:
          $ref: "#/components/schemas/Revision"
        timezone:
          $ref: "#/components/schemas/Timezone"
        locale:
          type: string
        working_hours:
          $ref: "#/components/schemas/WorkingHours"
        quiet_hours:
          $ref: "#/components/schemas/QuietHours"
        default_destination_ids:
          type: array
          items:
            $ref: "#/components/schemas/ID"
        account_defaults:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ID"
        budgets:
          $ref: "#/components/schemas/BudgetPreferences"
        input:
          $ref: "#/components/schemas/InputPreferences"
        onboarding_completed_at:
          $ref: "#/components/schemas/Instant"
        data_reset_at:
          $ref: "#/components/schemas/Instant"
        data_reset_pending:
          type: boolean
        updated_at:
          $ref: "#/components/schemas/Instant"

    PreferencesEditable:
      type: object
      required:
        - timezone
        - working_hours
        - default_destination_ids
        - account_defaults
        - budgets
      properties:
        timezone:
          $ref: "#/components/schemas/Timezone"
        locale:
          type: string
        working_hours:
          $ref: "#/components/schemas/WorkingHours"
        quiet_hours:
          $ref: "#/components/schemas/QuietHours"
        default_destination_ids:
          type: array
          items:
            $ref: "#/components/schemas/ID"
        account_defaults:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ID"
        budgets:
          $ref: "#/components/schemas/BudgetPreferences"
        input:
          $ref: "#/components/schemas/InputPreferences"
        onboarding_completed_at:
          $ref: "#/components/schemas/Instant"

    PreferencesChange:
      type: object
      required: [request_id, expected_revision, value]
      properties:
        request_id:
          $ref: "#/components/schemas/UUID"
        expected_revision:
          $ref: "#/components/schemas/Revision"
        value:
          $ref: "#/components/schemas/PreferencesEditable"

    DataResetRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: string
          enum: [RESET]
        resume_pending:
          type: boolean

    AccountDeleteRequest:
      type: object
      required: [confirmation]
      properties:
        confirmation:
          type: string
          minLength: 1
        resume_pending:
          type: boolean

    # -------------------------------------------------------------------------
    # Models, BYOK Keys, Home Connectors & API Costs
    # -------------------------------------------------------------------------
    ModelProfile:
      type: object
      required: [id, version, label, backend, model, lanes, paid]
      properties:
        id:
          type: string
          minLength: 1
        version:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        backend:
          type: string
          description: Provider or runtime backend (openai, anthropic, google, vercel_ai_gateway, openrouter, home, local, gateway)
        model:
          type: string
          minLength: 1
        lanes:
          type: array
          items:
            type: string
            enum: [chat, task]
        supported_reasoning:
          type: array
          items:
            type: string
        default_reasoning:
          type: string
        paid:
          type: boolean
        home_device_id:
          type: string
        availability:
          type: string
          enum: [online, offline, ollama_unavailable]

    ModelProfileCatalog:
      type: object
      required: [profiles]
      properties:
        default_chat_profile_id:
          type: string
        default_chat_reasoning:
          type: string
        default_task_profile_id:
          type: string
        default_task_reasoning:
          type: string
        profiles:
          type: array
          items:
            $ref: "#/components/schemas/ModelProfile"

    PinnedProfile:
      type: object
      properties:
        backend:
          type: string
        model:
          type: string
        adapter:
          type: string
        home_device_id:
          type: string
        model_digest:
          type: string
        endpoint:
          type: string
        supported_reasoning:
          type: array
          items:
            type: string
        default_reasoning:
          type: string
        paid:
          type: boolean

    ModelSelection:
      type: object
      properties:
        home_only:
          type: boolean
        chat_profile_id:
          type: string
        chat_profile_version:
          type: string
        chat_reasoning:
          type: string
        chat_pinned:
          $ref: "#/components/schemas/PinnedProfile"
        task_profile_id:
          type: string
        task_profile_version:
          type: string
        task_reasoning:
          type: string
        task_pinned:
          $ref: "#/components/schemas/PinnedProfile"

    ModelKeyProvider:
      type: object
      required: [provider, label, configured]
      properties:
        provider:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
        configured:
          type: boolean
        last4:
          type: string
        updated_at:
          $ref: "#/components/schemas/Instant"
        validated_at:
          $ref: "#/components/schemas/Instant"

    ModelKeysResponse:
      type: object
      required: [byok_required, providers]
      properties:
        byok_required:
          type: boolean
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ModelKeyProvider"

    SetModelKeyRequest:
      type: object
      required: [api_key]
      properties:
        api_key:
          type: string
          minLength: 1

    ModelSettings:
      type: object
      required: [model_profiles, selection, revision, recommendations]
      properties:
        model_profiles:
          $ref: "#/components/schemas/ModelProfileCatalog"
        selection:
          $ref: "#/components/schemas/ModelSelection"
        revision:
          $ref: "#/components/schemas/Revision"
        recommendations:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ModelSelection"

    SaveModelSettingsRequest:
      type: object
      required: [selection, expected_revision]
      properties:
        selection:
          $ref: "#/components/schemas/ModelSelection"
        expected_revision:
          $ref: "#/components/schemas/Revision"

    HomeConnectorModel:
      type: object
      required: [name]
      properties:
        name:
          type: string
        digest:
          type: string
        capabilities:
          type: array
          items:
            type: string

    HomeConnector:
      type: object
      required: [id, name, status, models]
      properties:
        id:
          $ref: "#/components/schemas/ID"
        name:
          type: string
        status:
          type: string
          enum: [online, offline, ollama_unavailable]
        last_seen_at:
          $ref: "#/components/schemas/Instant"
        version:
          type: string
        models:
          type: array
          items:
            $ref: "#/components/schemas/HomeConnectorModel"

    HomeConnectorDownloads:
      type: object
      properties:
        macos:
          type: string
        linux_amd64:
          type: string
        linux_arm64:
          type: string

    HomeConnectors:
      type: object
      required: [enabled, devices]
      properties:
        enabled:
          type: boolean
        devices:
          type: array
          items:
            $ref: "#/components/schemas/HomeConnector"
        downloads:
          $ref: "#/components/schemas/HomeConnectorDownloads"

    HomePairing:
      type: object
      required: [name, user_code, expires_at]
      properties:
        name:
          type: string
        user_code:
          type: string
        expires_at:
          $ref: "#/components/schemas/Instant"

    HomePairingRequest:
      type: object
      required: [user_code]
      properties:
        user_code:
          type: string
          minLength: 1

    HomeConnectorTestResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    CostAmount:
      type: object
      required: [cost_usd, priced_calls, unpriced_calls, local_calls, pending_calls]
      properties:
        cost_usd:
          type: number
        priced_calls:
          type: integer
          minimum: 0
        unpriced_calls:
          type: integer
          minimum: 0
        local_calls:
          type: integer
          minimum: 0
        pending_calls:
          type: integer
          minimum: 0

    ModelCost:
      allOf:
        - $ref: "#/components/schemas/CostAmount"
        - type: object
          required: [model]
          properties:
            model:
              type: string

    CostBucket:
      type: object
      required: [start_at, end_at, totals, models]
      properties:
        start_at:
          $ref: "#/components/schemas/Instant"
        end_at:
          $ref: "#/components/schemas/Instant"
