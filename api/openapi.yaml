openapi: 3.1.0
info:
  title: Nori API
  version: 1.0.0
  description: >
    Single source of truth for Nori's public /v1 HTTP API consumed by the Web
    client, iOS client, and Go runtime tests.
servers:
  - url: /
    description: Relative API origin
tags:
  - name: Capabilities
  - name: Conversation
  - name: Uploads
  - name: Results
  - name: Work
  - name: Interactions
  - name: Permissions
  - name: Automations
  - name: Goals
  - name: Inbox
  - name: Memory
  - name: Library
  - name: Connections
  - name: MCP
  - name: Tools
  - name: Settings
  - name: Diagnostics

paths:
  /v1/capabilities:
    get:
      operationId: getCapabilities
      tags: [Capabilities]
      summary: Read runtime capabilities and enabled assistant features
      responses:
        "200":
          description: Runtime capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"

  /v1/snapshot:
    get:
      operationId: getSnapshot
      tags: [Conversation]
      summary: Read a paginated snapshot of the assistant session
      parameters:
        - name: before
          in: query
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: Session snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /v1/events:
    get:
      operationId: streamEvents
      tags: [Conversation]
      summary: Server-Sent Events stream of live session updates and assistant deltas
      parameters:
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        "200":
          description: >
            Server-Sent Events stream emitting `reset`, `presence`, `message`,
            `task`, `result`, `read_position`, `conversation`, `memory`,
            `assistant_delta`, and `unknown` events.
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /v1/uploads:
    post:
      operationId: createUpload
      tags: [Uploads]
      summary: Upload an attachment binary for a chat message
      parameters:
        - name: id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: filename
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Saved attachment metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "415":
          $ref: "#/components/responses/ErrorResponse"

  /v1/uploads/{id}:
    get:
      operationId: getUpload
      tags: [Uploads]
      summary: Download an uploaded attachment
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Uploaded file bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "410":
          $ref: "#/components/responses/ErrorResponse"

  /v1/results/{id}:
    get:
      operationId: getResult
      tags: [Results]
      summary: Read a saved task result record
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Saved result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedResult"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/results/{id}/file:
    get:
      operationId: getResultFile
      tags: [Results]
      summary: Download the file or screenshot attached to a saved result
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Result file bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "410":
          $ref: "#/components/responses/ErrorResponse"

  /v1/conversations/assistant:
    get:
      operationId: getAssistantConversation
      tags: [Conversation]
      summary: Read the canonical assistant conversation view
      responses:
        "200":
          description: Assistant conversation view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationView"

  /v1/conversations/assistant/messages:
    get:
      operationId: listAssistantConversationMessages
      tags: [Conversation]
      summary: Page older messages in the assistant conversation
      parameters:
        - name: before
          in: query
          schema:
            type: string
            maxLength: 256
      responses:
        "200":
          description: Message page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationHistoryResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
    post:
      operationId: sendAssistantConversationMessage
      tags: [Conversation]
      summary: Submit a user message to the assistant conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationMessageRequest"
      responses:
        "202":
          description: Message accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationMessageAccepted"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /v1/conversations/assistant/operations:
    get:
      operationId: listAssistantConversationOperations
      tags: [Conversation]
      summary: List recorded operations for a task owned by the assistant conversation
      parameters:
        - name: ownerId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Operations list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationOperationsResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /v1/conversations/assistant/cancel:
    post:
      operationId: cancelAssistantConversationTurn
      tags: [Conversation]
      summary: Cancel an active assistant turn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationCancelRequest"
      responses:
        "200":
          description: Updated conversation view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationView"
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /v1/conversations/assistant/retry:
    post:
      operationId: retryAssistantConversationTurn
      tags: [Conversation]
      summary: Retry a failed assistant turn or message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConversationRetryRequest"
      responses:
        "202":
          description: Retry accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationRetryAccepted"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /v1/conversations/assistant/events:
    get:
      operationId: streamAssistantConversationEvents
      tags: [Conversation]
      summary: Server-Sent Events stream for the canonical assistant conversation contract
      parameters:
        - name: after
          in: query
          schema:
            type: integer
            minimum: 0
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Server-Sent Events stream
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /v1/conversations/assistant/uploads:
    post:
      operationId: createAssistantUpload
      tags: [Uploads]
      summary: Upload an attachment under the assistant conversation route
      parameters:
        - name: id
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: filename
          in: query
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Saved attachment metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "413":
          $ref: "#/components/responses/ErrorResponse"
        "415":
          $ref: "#/components/responses/ErrorResponse"

  /v1/conversations/assistant/uploads/{id}:
    get:
      operationId: getAssistantUpload
      tags: [Uploads]
      summary: Download an uploaded attachment under the assistant conversation route
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Uploaded file bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "410":
          $ref: "#/components/responses/ErrorResponse"

  /v1/assistant/summary:
    get:
      operationId: getAssistantSummary
      tags: [Work]
      summary: Read badge counts and next scheduled run time
      responses:
        "200":
          description: Assistant summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantSummary"

  /v1/work:
    get:
      operationId: listWork
      tags: [Work]
      summary: List background tasks grouped by bucket
      parameters:
        - name: bucket
          in: query
          schema:
            type: string
            enum: [needs_you, working, finished]
      responses:
        "200":
          description: Work items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/WorkItem"
                  next_cursor:
                    type: string

  /v1/work/{task_id}:
    get:
      operationId: getWorkDetail
      tags: [Work]
      summary: Read detailed status, operations, interactions, and events for a task
      parameters:
        - $ref: "#/components/parameters/TaskIdParam"
      responses:
        "200":
          description: Work detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkDetail"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/work/{task_id}/operations:
    get:
      operationId: listWorkOperations
      tags: [Work]
      summary: List projected operations for a single task
      parameters:
        - $ref: "#/components/parameters/TaskIdParam"
      responses:
        "200":
          description: Task operations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OperationProjection"
                  next_cursor:
                    type: string
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/work/{task_id}/actions:
    post:
      operationId: performWorkAction
      tags: [Work]
      summary: Stop or continue a background task
      parameters:
        - $ref: "#/components/parameters/TaskIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkActionRequest"
      responses:
        "202":
          description: Action queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/operations:
    get:
      operationId: listOperations
      tags: [Work]
      summary: List recent operations across tasks
      parameters:
        - name: connection_id
          in: query
          schema:
            $ref: "#/components/schemas/ID"
      responses:
        "200":
          description: Recent operations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/OperationProjection"
                  next_cursor:
                    type: string

  /v1/mutations/{request_id}:
    get:
      operationId: getMutationReceipt
      tags: [Work]
      summary: Look up an idempotent mutation receipt by request ID
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: Saved mutation receipt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationReceipt"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/interactions:
    get:
      operationId: listInteractions
      tags: [Interactions]
      summary: List user interactions (approvals, questions, account selections, sign-in requests)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, resolved, expired, superseded]
        - name: task_id
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/CursorParam"
      responses:
        "200":
          description: Interactions list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Interaction"
                  next_cursor:
                    type: string

  /v1/interactions/{id}:
    get:
      operationId: getInteraction
      tags: [Interactions]
      summary: Read a single interaction
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Interaction
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Interaction"
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/interactions/{id}/responses:
    post:
      operationId: respondToInteraction
      tags: [Interactions]
      summary: Submit a response to a pending interaction
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteractionResponse"
      responses:
        "200":
          description: Response applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /v1/permissions:
    get:
      operationId: listPermissionRules
      tags: [Permissions]
      summary: List permission rules
      parameters:
        - name: automation_id
          in: query
          schema:
            $ref: "#/components/schemas/ID"
        - name: goal_id
          in: query
          schema:
            $ref: "#/components/schemas/ID"
      responses:
        "200":
          description: Permission rules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PermissionRule"
                  next_cursor:
                    type: string
    post:
      operationId: createPermissionRule
      tags: [Permissions]
      summary: Create a permission rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionRuleChange"
      responses:
        "201":
          description: Permission rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /v1/permissions/{id}:
    get:
      operationId: getPermissionRule
      tags: [Permissions]
      summary: Read a permission rule
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Permission rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionRule"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    put:
      operationId: updatePermissionRule
      tags: [Permissions]
      summary: Update a permission rule
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionRuleChange"
      responses:
        "200":
          description: Permission rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /v1/permissions/{id}/actions:
    post:
      operationId: actOnPermissionRule
      tags: [Permissions]
      summary: Revoke a permission rule
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionRuleAction"
      responses:
        "200":
          description: Permission rule revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /v1/automations:
    get:
      operationId: listAutomations
      tags: [Automations]
      summary: List automations (routines)
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [enabled, paused, cancelled]
      responses:
        "200":
          description: Automations list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Automation"
                  next_cursor:
                    type: string
    post:
      operationId: createAutomation
      tags: [Automations]
      summary: Create an automation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationChange"
      responses:
        "201":
          description: Automation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /v1/automations/preview:
    post:
      operationId: previewAutomation
      tags: [Automations]
      summary: Preview upcoming run times, warnings, and proposed permissions for an automation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationEditable"
      responses:
        "200":
          description: Automation preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationPreview"
        "400":
          $ref: "#/components/responses/ErrorResponse"

  /v1/automations/{id}:
    get:
      operationId: getAutomation
      tags: [Automations]
      summary: Read an automation
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Automation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Automation"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    put:
      operationId: updateAutomation
      tags: [Automations]
      summary: Update an automation
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationChange"
      responses:
        "200":
          description: Automation updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /v1/automations/{id}/actions:
    post:
      operationId: actOnAutomation
      tags: [Automations]
      summary: Pause, resume, cancel, snooze, or run an automation now
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationAction"
      responses:
        "200":
          description: Automation action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /v1/automations/{id}/occurrences:
    get:
      operationId: listAutomationOccurrences
      tags: [Automations]
      summary: List scheduled occurrences for an automation
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Occurrences list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Occurrence"
                  next_cursor:
                    type: string
        "404":
          $ref: "#/components/responses/ErrorResponse"

  /v1/goals:
    get:
      operationId: listGoals
      tags: [Goals]
      summary: List goals
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, paused, completed, abandoned]
      responses:
        "200":
          description: Goals list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Goal"
                  next_cursor:
                    type: string
    post:
      operationId: createGoal
      tags: [Goals]
      summary: Create a goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalChange"
      responses:
        "201":
          description: Goal created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /v1/goals/{id}:
    get:
      operationId: getGoal
      tags: [Goals]
      summary: Read a goal
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: Goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Goal"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    put:
      operationId: updateGoal
      tags: [Goals]
      summary: Update a goal
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalChange"
      responses:
        "200":
          description: Goal updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"

  /v1/goals/{id}/actions:
    post:
      operationId: actOnGoal
      tags: [Goals]
      summary: Pause, resume, complete, or abandon a goal
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalAction"
      responses:
        "200":
          description: Goal action applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MutationReceipt"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
