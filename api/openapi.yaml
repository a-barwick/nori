        availability:
          type: string
          enum: [ready, needs_connection, needs_permission, disabled, unavailable]
        reason_code:
          type: string
        recovery:
          type: string
          enum: [connect, repair, enable, choose_account, request_access]
        capability:
          type: string
        integration_id:
          type: string
        effect:
          $ref: "#/components/schemas/Effect"
        exposure:
          type: string
          enum: [direct, discoverable, programmatic, disabled]

    AvailableToolList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AvailableTool"
        next_cursor:
          type: string

    # -------------------------------------------------------------------------
    # Diagnostics & Feedback
    # -------------------------------------------------------------------------
    DiagnosticItem:
      type: object
      required: [kind, severity, subject, message]
      properties:
        kind:
          type: string
          enum:
            - stuck_stop
            - stuck_task
            - cleanup_pending
            - waiting_on_user
            - unresolved_write
            - missed_wake
            - delivery_failed
            - connection_attention
            - mcp_failed
        severity:
          type: string
          enum: [info, warning, error]
        subject:
          type: object
          additionalProperties: true
        message:
          type: string
        repair:
          type: string
        since:
          $ref: "#/components/schemas/Instant"

    DiagnosticsActionRequest:
      type: object
      required: [request_id, expected_revision, value]
      properties:
        request_id:
          $ref: "#/components/schemas/UUID"
        expected_revision:
          $ref: "#/components/schemas/Revision"
        value:
          type: object
          required: [action]
          properties:
            action:
              type: string
              enum: [resume_delivery, deliver_answers, run_scheduler]

    FeedbackRequest:
      type: object
      required: [request_id, expected_revision, value]
      properties:
        request_id:
          $ref: "#/components/schemas/UUID"
        expected_revision:
          $ref: "#/components/schemas/Revision"
        value:
          type: object
          required: [kind]
          properties:
            kind:
              type: string
              enum: [wrong_result, wrong_action, too_slow, missing_capability, broken_connection]
            task_id:
              type: string
            operation_id:
              type: string
            connection_id:
              $ref: "#/components/schemas/ID"
            text:
              type: string
              maxLength: 4000
