name: Nori iOS symbols
description: Verify or upload the dSYMs from an Xcode archive
inputs:
  archive-path:
    description: Path to the Nori .xcarchive on this runner
    required: true
  verify-only:
    description: Compare the app and dSYM UUIDs without using Sentry
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # GitHub's macOS images don't include sentry-cli. Install a pinned release and check
    # it against the SHA-256 GitHub publishes for that asset before running it.
    - name: Install sentry-cli
      if: inputs.verify-only != 'true'
      shell: bash
      env:
        SENTRY_CLI_VERSION: "3.8.2"
        SENTRY_CLI_SHA256: "2d1b118fa46960ba5e8e0cca9a6e197366905776a0ddc5a89c7d05a3908b77db"
      run: |
        if command -v sentry-cli >/dev/null 2>&1; then sentry-cli --version; exit 0; fi
        bin_dir="$RUNNER_TEMP/sentry-cli-bin"
        mkdir -p "$bin_dir"
        curl -fsSL --retry 3 -o "$bin_dir/sentry-cli" \
          "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-Darwin-universal"
        echo "${SENTRY_CLI_SHA256}  $bin_dir/sentry-cli" | shasum -a 256 -c -
        chmod +x "$bin_dir/sentry-cli"
        echo "$bin_dir" >> "$GITHUB_PATH"
        "$bin_dir/sentry-cli" --version

    - name: Process Nori iOS symbols
      shell: bash
      env:
        NORI_IOS_ARCHIVE_PATH: ${{ inputs.archive-path }}
        NORI_VERIFY_IOS_SYMBOLS: ${{ inputs.verify-only }}
      run: |
        uploader="$GITHUB_ACTION_PATH/../../../scripts/upload-ios-dsyms.sh"
        case "$NORI_VERIFY_IOS_SYMBOLS" in
          true) "$uploader" --verify-only "$NORI_IOS_ARCHIVE_PATH" ;;
          false)
            : "${SENTRY_AUTH_TOKEN:?Set SENTRY_AUTH_TOKEN for the upload step}"
            "$uploader" "$NORI_IOS_ARCHIVE_PATH"
            ;;
          *) echo "verify-only must be true or false" >&2; exit 1 ;;
        esac
