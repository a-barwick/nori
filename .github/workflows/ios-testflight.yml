name: iOS Private TestFlight

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quiet-period:
    name: Wait for iOS changes to settle
    if: github.repository == 'a-barwick/nori' && github.ref == 'refs/heads/main' && vars.NORI_TESTFLIGHT_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ios-testflight-quiet-period
      cancel-in-progress: true
    steps:
      - name: Wait ten minutes for push-triggered builds
        if: github.event_name == 'push'
        run: sleep 600

  distribute:
    name: Archive and upload to private TestFlight
    needs: quiet-period
    runs-on: xcode-27
    timeout-minutes: 30
    environment: ios-testflight
    permissions:
      contents: read
      actions: read
    concurrency:
      group: ios-testflight-upload
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for newer iOS changes on main
        id: freshness
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          event_ios_commit=$(git log -1 --first-parent --format=%H "$GITHUB_SHA" -- ios/)
          latest_ios_commit=$(git log -1 --first-parent --format=%H origin/main -- ios/)
          if git merge-base --is-ancestor "$GITHUB_SHA" origin/main && [[ "$event_ios_commit" == "$latest_ios_commit" ]]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'A newer iOS revision superseded this build.'
          fi

      - name: Wait for iOS CI to pass on this commit
        if: steps.freshness.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci-status.sh "$GITHUB_SHA" --wait --only-job "Swift package and iOS app"

      - name: Archive release build
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        env:
          SENTRY_DSN: ${{ vars.SENTRY_IOS_DSN }}
        run: |
          build_number=$((174 + GITHUB_RUN_NUMBER))
          xcodebuild -project ios/Nori.xcodeproj -scheme Nori -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Nori.xcarchive" \
            -disableAutomaticPackageResolution CODE_SIGNING_ALLOWED=NO \
            "CURRENT_PROJECT_VERSION=$build_number" "SENTRY_DSN=$SENTRY_DSN" archive

      - name: Verify and upload archive symbols
        if: steps.freshness.outputs.current == 'true'
        uses: ./.github/actions/ios-symbols
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT_IOS: ${{ vars.SENTRY_PROJECT_IOS }}
        with:
          archive-path: ${{ runner.temp }}/Nori.xcarchive

      - name: Sign and upload the archive
        if: steps.freshness.outputs.current == 'true'
        shell: bash
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          APPLE_DISTRIBUTION_P12: ${{ secrets.APPLE_DISTRIBUTION_P12 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          APPLE_NORI_PROFILE: ${{ secrets.APPLE_NORI_PROFILE }}
        run: |
          : "${ASC_KEY_ID:?Set ASC_KEY_ID in the ios-testflight environment}"
          : "${ASC_ISSUER_ID:?Set ASC_ISSUER_ID in the ios-testflight environment}"
          : "${ASC_PRIVATE_KEY:?Set ASC_PRIVATE_KEY in the ios-testflight environment}"
          : "${APPLE_DISTRIBUTION_P12:?Set the Apple Distribution certificate and private key}"
          : "${APPLE_DISTRIBUTION_P12_PASSWORD:?Set the PKCS#12 password}"
          : "${APPLE_NORI_PROFILE:?Set the Nori App Store Connect provisioning profile}"
          umask 077
          signing_dir=$(mktemp -d "$RUNNER_TEMP/nori-signing.XXXXXX")
          auth_key="$signing_dir/AuthKey.p8"
          keychain="$signing_dir/signing.keychain-db"
          certificate="$signing_dir/distribution.p12"
          profile="$signing_dir/nori.mobileprovision"
          profile_plist="$signing_dir/profile.plist"
          cleanup() {
            if [[ -n ${installed_profile:-} ]]; then rm -f -- "$installed_profile"; fi
            security delete-keychain "$keychain" 2>/dev/null || true
            rm -f -- "$auth_key" "$certificate" "$profile" "$profile_plist"
            rmdir -- "$signing_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$auth_key"
          printf '%s' "$APPLE_DISTRIBUTION_P12" | base64 -D > "$certificate"
          printf '%s' "$APPLE_NORI_PROFILE" | base64 -D > "$profile"
          unset ASC_PRIVATE_KEY APPLE_DISTRIBUTION_P12 APPLE_NORI_PROFILE

          security cms -D -i "$profile" -o "$profile_plist"
          profile_app_id=$(plutil -extract Entitlements.application-identifier raw "$profile_plist")
          profile_uuid=$(plutil -extract UUID raw "$profile_plist")
          [[ "$profile_app_id" == 'GAB2UG6AMY.com.nori.ios' ]]
          [[ "$profile_uuid" =~ ^[0-9A-Fa-f-]{36}$ ]]
          profiles_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profiles_dir"
          installed_profile="$profiles_dir/$profile_uuid.mobileprovision"
          cp "$profile" "$installed_profile"

          keychain_password=$(openssl rand -hex 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign
          unset APPLE_DISTRIBUTION_P12_PASSWORD
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"

          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Nori.xcarchive" \
            -exportPath "$RUNNER_TEMP/NoriTestFlight" \
            -exportOptionsPlist ios/Config/TestFlightExportOptions.plist \
            -allowProvisioningUpdates -authenticationKeyPath "$auth_key" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
