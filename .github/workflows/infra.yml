name: Infrastructure

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  schedule:
    # Daily drift check: fails when live GCP no longer matches infra/.
    - cron: "41 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infra-production
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/8273801370/locations/global/workloadIdentityPools/github/providers/nori-main
          service_account: nori-ci-infra@bot-111549.iam.gserviceaccount.com

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Init
        run: terraform init -input=false -lockfile=readonly

      # The repository is public, so the log shows which resources change, not the diff.
      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -no-color -lock-timeout=5m -detailed-exitcode -out=tfplan > plan.log 2>&1
          code=$?
          set -e
          if [[ "$code" -eq 1 ]]; then
            grep -E '^(Error|│)' plan.log || tail -20 plan.log
            exit 1
          fi
          terraform show -json tfplan |
            jq -r '.resource_changes[] | select(.change.actions != ["no-op"] and .change.actions != ["read"]) | "\(.change.actions | join("+"))\t\(.address)"' |
            tee changes.txt
          echo "changes=$([[ "$code" -eq 2 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          {
            echo "### Terraform plan"
            if [[ "$code" -eq 2 ]]; then echo '```'; cat changes.txt; echo '```'; else echo "No changes."; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # terraform plan only sees managed resources. This catches ones created by hand.
      - name: Find unmanaged resources
        id: unmanaged
        run: |
          if ./check-unmanaged.sh > unmanaged.txt; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            { echo "### Resources not in infra/"; echo '```'; cat unmanaged.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            while IFS=$'\t' read -r kind name; do echo "::warning::$kind $name is not managed by infra/"; done < unmanaged.txt
          fi

      - name: Fail on drift
        if: github.event_name == 'schedule' && (steps.plan.outputs.changes == 'true' || steps.unmanaged.outputs.found == 'true')
        run: |
          echo "::error::Live GCP differs from infra/. Run 'make infra-plan' and infra/check-unmanaged.sh locally to see why, then fix it in Terraform."
          exit 1

      - name: Apply
        if: github.event_name != 'schedule' && steps.plan.outputs.changes == 'true'
        run: terraform apply -input=false -no-color -lock-timeout=5m tfplan > apply.log 2>&1 || { grep -E '^(Error|│)' apply.log || tail -20 apply.log; exit 1; }
