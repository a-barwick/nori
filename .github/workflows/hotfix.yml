name: Hotfix

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Service group(s) to deploy (auto detects changes vs live)"
        type: choice
        default: auto
        options:
          - auto
          - core
          - web
          - site
          - all
      skip_checks:
        description: "Emergency escape hatch: skip fast preflight checks (make check)"
        type: boolean
        default: false
      bake_seconds:
        description: "Post-promotion bake duration in seconds (default 60)"
        type: choice
        default: "60"
        options:
          - "60"
          - "0"
          - "180"
          - "600"
      reason:
        description: "Short note recorded in the workflow summary"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  plan:
    name: Plan hotfix
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    outputs:
      core: ${{ steps.resolve.outputs.core }}
      web: ${{ steps.resolve.outputs.web }}
      site: ${{ steps.resolve.outputs.site }}
      has_groups: ${{ steps.resolve.outputs.has_groups }}
      groups: ${{ steps.resolve.outputs.groups }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate to Cloud Run
        if: inputs.target == 'auto'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/8273801370/locations/global/workloadIdentityPools/github/providers/nori-main
          service_account: nori-ci-release@bot-111549.iam.gserviceaccount.com

      - name: Resolve target groups
        id: resolve
        env:
          TARGET: ${{ inputs.target }}
        run: |
          core=false
          web=false
          site=false
          case "$TARGET" in
            auto)
              while IFS= read -r group; do
                case "$group" in
                  core) core=true ;;
                  web) web=true ;;
                  site) site=true ;;
                esac
              done < <(scripts/release.sh --plan-groups)
              ;;
            core) core=true ;;
            web) web=true ;;
            site)
              if [[ ! -f site/Dockerfile ]]; then
                echo "site/Dockerfile not found; cannot hotfix site." >&2
                exit 1
              fi
              site=true
              ;;
            all)
              core=true
              web=true
              if [[ -f site/Dockerfile ]]; then
                site=true
              fi
              ;;
            *)
              echo "Unsupported target: $TARGET" >&2
              exit 1
              ;;
          esac

          groups=()
          [[ "$core" == true ]] && groups+=(core)
          [[ "$web" == true ]] && groups+=(web)
          [[ "$site" == true ]] && groups+=(site)

          has_groups=false
          if [[ "${#groups[@]}" -gt 0 ]]; then
            has_groups=true
          fi

          {
            echo "core=$core"
            echo "web=$web"
            echo "site=$site"
            echo "has_groups=$has_groups"
            echo "groups=${groups[*]}"
          } >> "$GITHUB_OUTPUT"

          if [[ "$has_groups" != true ]]; then
            echo "### Hotfix ${GITHUB_SHA:0:12}: nothing to release" >> "$GITHUB_STEP_SUMMARY"
            echo "Live Cloud Run services already match HEAD for all groups." >> "$GITHUB_STEP_SUMMARY"
          fi

  preflight:
    name: Preflight (make check)
    needs: [plan]
    if: needs.plan.outputs.has_groups == 'true' && !inputs.skip_checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Run make check
        run: make check

  build-core:
    name: Build core image
    needs: [plan]
    if: needs.plan.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Authenticate to Artifact Registry
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/8273801370/locations/global/workloadIdentityPools/github/providers/nori-main
          service_account: nori-ci-images@bot-111549.iam.gserviceaccount.com

      - name: Build and push nori-core
        run: scripts/build-image.sh --skip-existing core "$GITHUB_SHA"

  build-web:
    name: Build web image
    needs: [plan]
    if: needs.plan.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Authenticate to Artifact Registry
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/8273801370/locations/global/workloadIdentityPools/github/providers/nori-main
          service_account: nori-ci-images@bot-111549.iam.gserviceaccount.com

      - name: Build and push nori-web
        env:
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_WEB || vars.SENTRY_PROJECT }}
        run: scripts/build-image.sh --skip-existing web "$GITHUB_SHA"

  build-site:
    name: Build site image
    needs: [plan]
    if: needs.plan.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Authenticate to Artifact Registry
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/8273801370/locations/global/workloadIdentityPools/github/providers/nori-main
          service_account: nori-ci-images@bot-111549.iam.gserviceaccount.com

      - name: Build and push nori-site
        run: scripts/build-image.sh --skip-existing site "$GITHUB_SHA"

  deploy:
    name: Deploy hotfix
    needs: [plan, preflight, build-core, build-web, build-site]
    if: >-
      always() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.has_groups == 'true' &&
      (needs.preflight.result == 'success' || needs.preflight.result == 'skipped') &&
      (needs.build-core.result == 'success' || needs.build-core.result == 'skipped') &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped') &&
      (needs.build-site.result == 'success' || needs.build-site.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate to Cloud Run
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/8273801370/locations/global/workloadIdentityPools/github/providers/nori-main
          service_account: nori-ci-release@bot-111549.iam.gserviceaccount.com

      - name: Release hotfix
        env:
          HOTFIX_CORE: ${{ needs.plan.outputs.core }}
          HOTFIX_WEB: ${{ needs.plan.outputs.web }}
          HOTFIX_SITE: ${{ needs.plan.outputs.site }}
          HOTFIX_SKIP_CHECKS: ${{ inputs.skip_checks }}
          HOTFIX_REASON: ${{ inputs.reason }}
          NORI_RELEASE_BAKE_SECONDS: ${{ inputs.bake_seconds }}
        run: |
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo "### Hotfix metadata"
              echo "- Target: \`${{ inputs.target }}\` (groups: \`${{ needs.plan.outputs.groups }}\`)"
              echo "- Preflight checks skipped: \`$HOTFIX_SKIP_CHECKS\`"
              echo "- Bake seconds: \`$NORI_RELEASE_BAKE_SECONDS\`"
              if [[ -n "$HOTFIX_REASON" ]]; then
                echo "- Reason: $HOTFIX_REASON"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          args=(--force-unverified --quick --only)
          [[ "$HOTFIX_CORE" == true ]] && args+=(--core)
          [[ "$HOTFIX_WEB" == true ]] && args+=(--web)
          [[ "$HOTFIX_SITE" == true ]] && args+=(--site)
          scripts/release.sh "${args[@]}"
