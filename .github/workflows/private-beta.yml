name: Sync private testers

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    if: github.repository == 'a-barwick/nori' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: ios-testflight
    timeout-minutes: 10
    concurrency:
      group: nori-private-beta-sync
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Read the private TestFlight group
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: node scripts/private-beta.mjs "$RUNNER_TEMP/testers.tfvars.json"

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/8273801370/locations/global/workloadIdentityPools/github/providers/nori-main
          service_account: nori-ci-infra@bot-111549.iam.gserviceaccount.com

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Apply private tester access
        working-directory: infra/private-beta
        run: |
          terraform init -input=false -lockfile=readonly
          # IAM diagnostics can contain tester addresses in this public repository.
          if ! terraform apply -input=false -auto-approve -lock-timeout=2m -no-color \
              -var-file="$RUNNER_TEMP/testers.tfvars.json" > "$RUNNER_TEMP/private-beta.log" 2>&1; then
            echo "::error::Could not apply private tester access. Check the bootstrap secret and Terraform access to the private-beta state and nori-web IAP policy."
            exit 1
          fi
          tail -1 "$RUNNER_TEMP/private-beta.log"
