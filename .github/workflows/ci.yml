name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    name: Check (Go, OpenAPI, Web, Scripts, Infra)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false

      - name: Run make check
        run: make check

      - name: Test deployment scripts
        run: node --test scripts/*.test.mjs

      - name: Lint shell scripts
        run: shellcheck -S warning scripts/*.sh

      - name: Persona harness and bundle validation
        run: |
          python3 -m unittest discover -s scripts/persona-sim
          make sim-personas-validate

      - name: Audit web dependencies
        working-directory: web
        run: bun audit

      - name: Audit Go dependencies
        working-directory: core
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

  web-browser:
    name: Web Build, Browser E2E & Full-Stack Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: nori
          POSTGRES_DB: nori
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nori -d nori"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build web
        working-directory: web
        run: bun run build

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install the browser test runner
        working-directory: web
        run: bunx playwright install --with-deps chromium

      - name: Browser and proxy regression tests
        working-directory: web
        run: bun run test:browser

      - name: Full-stack Web-Core smoke test
        env:
          NORI_TEST_POSTGRES_URL: postgres://nori@127.0.0.1:5432/postgres?sslmode=disable
        run: node scripts/fullstack-smoke.mjs

  ios:
    name: Swift package and iOS app
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Swift package tests
        run: swift test --package-path ios/NoriKit
      - name: iOS Simulator build
        run: xcodebuild -project ios/Nori.xcodeproj -scheme Nori -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build


  go-race:
    name: Go Race Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      - name: Go race tests
        working-directory: core
        run: go test -race ./...

  deep-sim:
    name: Deep Deterministic Simulation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      - name: Deep deterministic simulation
        run: make sim-deep

  postgres-integration:
    name: Postgres 18 Integration, Crash Recovery & Load
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: nori
          POSTGRES_DB: nori
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nori -d nori"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: core/go.mod
          cache: true
          cache-dependency-path: core/go.sum

      - name: Provision isolated test databases
        run: |
          psql "postgres://nori@127.0.0.1:5432/postgres?sslmode=disable" -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE nori_crash;" \
            -c "CREATE DATABASE nori_load;"

      - name: Postgres conformance (make sim-pg)
        env:
          NORI_TEST_POSTGRES_URL: postgres://nori@127.0.0.1:5432/nori?sslmode=disable
        run: make sim-pg

      - name: Parallel Postgres backend & memstore conformance (-race)
        working-directory: core
        env:
          NORI_TEST_POSTGRES_URL: postgres://nori@127.0.0.1:5432/nori?sslmode=disable
        run: go test -race -count=1 ./internal/state/postgres ./internal/sim/memstore

      - name: Split-role SIGKILL crash recovery (cold DB)
        working-directory: core
        env:
          NORI_POSTGRES_CRASH_TEST_URL: postgres://nori@127.0.0.1:5432/nori_crash?sslmode=disable
        run: go test -v -count=1 ./internal/worker -run TestSplitRoleSIGKILLCrashRecovery

      - name: Cold-DB concurrent load & wake-cancel smoke test
        working-directory: core
        env:
          NORI_POSTGRES_LOAD_TEST_URL: postgres://nori@127.0.0.1:5432/nori_load?sslmode=disable
        run: go test -v -count=1 ./internal/worker -run TestPostgresLoadConcurrencyAndWakeCancel


      - name: Isolated parallel persona smoke
        env:
          NORI_ENV_FILE: /dev/null
          NORI_ENV_PROFILE: test
          NORI_POSTGRES_URL: postgres://nori@127.0.0.1:5432/nori?sslmode=disable
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path
          from tempfile import TemporaryDirectory

          sys.path.insert(0, "scripts/persona-sim")
          import runner

          with TemporaryDirectory(prefix="nori-persona-ci-") as temporary:
              runner.RUNS_DIR = Path(temporary)
              sys.argv[1:] = ["--preset", "memory-pack", "--concurrency", "2", "--stub-models", "--max-events", "2", "--no-grade", "--keep-db"]
              result = runner.main()
              assert result == 0, result
              reports = [json.loads(file.read_text()) for file in runner.RUNS_DIR.glob("*/*/summary.json")]
              assert len(reports) == 3 and len({report["user_id"] for report in reports}) == 3, reports
              for report in reports:
                  assert report["events_executed"] == 2 and report["stub_models"], report
                  assert not any(report[key] for key in ("http_5xx_count", "harness_timeouts", "ui_error_count")), report
          PY
          count="$(psql "$NORI_POSTGRES_URL" -Atc "SELECT count(*) FROM pg_database WHERE datname ~ '^nori_sim_[0-9a-f]{10}$'")"
          test "$count" -eq 3

  images:
    name: Build images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, web-browser, go-race, postgres-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Authenticate to Artifact Registry
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/8273801370/locations/global/workloadIdentityPools/github/providers/nori-main
          service_account: nori-ci-images@bot-111549.iam.gserviceaccount.com

      - name: Build and push the core and web images
        env:
          REGISTRY: us-central1-docker.pkg.dev/bot-111549/nori-poc
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker buildx create --name nori-builder --driver docker-container --use
          docker buildx build --platform linux/amd64 -f core/infrastructure/Dockerfile \
            --cache-from "type=registry,ref=$REGISTRY/nori-core:buildcache" \
            --cache-to "type=registry,ref=$REGISTRY/nori-core:buildcache,mode=max" \
            --build-arg "SENTRY_RELEASE=$GITHUB_SHA" -t "$REGISTRY/nori-core:$GITHUB_SHA" --push core
          docker buildx build --platform linux/amd64 -f web/Dockerfile \
            --cache-from "type=registry,ref=$REGISTRY/nori-web:buildcache" \
            --cache-to "type=registry,ref=$REGISTRY/nori-web:buildcache,mode=max" \
            --build-arg "SENTRY_RELEASE=$GITHUB_SHA" -t "$REGISTRY/nori-web:$GITHUB_SHA" --push .

      # A separate step so a broken site build never blocks the core and web images.
      - name: Build and push the site image
        if: hashFiles('site/Dockerfile') != ''
        env:
          REGISTRY: us-central1-docker.pkg.dev/bot-111549/nori-poc
        run: |
          docker buildx build --platform linux/amd64 -f site/Dockerfile \
            --cache-from "type=registry,ref=$REGISTRY/nori-site:buildcache" \
            --cache-to "type=registry,ref=$REGISTRY/nori-site:buildcache,mode=max" \
            -t "$REGISTRY/nori-site:$GITHUB_SHA" --push site
