name: Release

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      quick:
        description: "Skip Deep Deterministic Simulation and use a 60s bake"
        type: boolean
        default: true
      allow_fallback:
        description: "Fall back to an older green commit if main HEAD is not ready"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  release:
    name: Release
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.NORI_AUTO_RELEASE != 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Authenticate to Cloud Run
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/8273801370/locations/global/workloadIdentityPools/github/providers/nori-main
          service_account: nori-ci-release@bot-111549.iam.gserviceaccount.com

      - name: Release commit
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_QUICK: ${{ github.event_name == 'workflow_dispatch' && inputs.quick != false }}
          RELEASE_LATEST_GREEN: ${{ github.event_name == 'schedule' || inputs.allow_fallback == true }}
        run: |
          args=()
          if [[ "$RELEASE_LATEST_GREEN" == true ]]; then
            args+=(--latest-green)
          fi
          if [[ "$RELEASE_QUICK" == true ]]; then
            args+=(--quick)
          fi
          scripts/release.sh "${args[@]}"
